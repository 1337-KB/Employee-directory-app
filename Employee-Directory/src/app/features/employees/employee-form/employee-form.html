<h2>{{ isEditMode ? 'Edit Employee' : 'Add Employee' }}</h2>

<div *ngIf="loading()" style="padding: 20px; text-align: center; color: #666;">
  Loading employee data...
</div>

<form [formGroup]="employeeForm" *ngIf="!loading()" (ngSubmit)="onSubmit()">
  <label for="firstName">First Name:</label>
  <input id="firstName" formControlName="firstName"><br>
  <div *ngIf="employeeForm.get('firstName')?.invalid && employeeForm.get('firstName')?.touched">
    <span style="color: red;">First Name is required.</span>
  </div>

  <label for="lastName">Last Name:</label>
  <input id="lastName" formControlName="lastName"><br>
  <div *ngIf="employeeForm.get('lastName')?.invalid && employeeForm.get('lastName')?.touched">
    <span style="color: red;">Last Name is required.</span>
  </div>

  <label for="role">Role:</label>
  <input id="role" formControlName="role"><br>
  <div *ngIf="employeeForm.get('role')?.invalid && employeeForm.get('role')?.touched">
    <span style="color: red;">Role is required.</span>
  </div>

  <label for="email">Email:</label>
  <input id="email" formControlName="email"><br>
  <div *ngIf="employeeForm.get('email')?.invalid && employeeForm.get('email')?.touched">
    <span style="color: red;" *ngIf="employeeForm.get('email')?.errors?.['required']">Email is required.</span>
    <span style="color: red;" *ngIf="employeeForm.get('email')?.errors?.['email']">Invalid email format.</span>
  </div>

  <button type="submit" [disabled]="employeeForm.invalid">
    {{ isEditMode ? 'Update' : 'Add' }} Employee
  </button>
  <button type="button" (click)="router.navigate(['/employees'])" style="margin-left: 8px; background-color: #f44336; color: white;">
    Cancel
  </button>
</form>
